name: Build Postgres Image

on:
  push:
    branches: [ master, main ]
    paths:
      - 'postgres/Dockerfile'
      - 'docker-compose.yaml'
      - '.github/workflows/build-postgres-image.yml'
      - 'init-scripts/**'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: thegreatpostgres-postgres
  REGISTRY: ghcr.io

jobs:
  build-amd64:
    name: Build AMD64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: postgres/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest-amd64
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-amd64

  build-arm64:
    name: Build ARM64 (native)
    runs-on: ubuntu-22.04-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: postgres/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest-arm64
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-arm64

  manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-24.04
    needs: [ build-amd64, build-arm64 ]
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest (latest)
        run: |
          set -euo pipefail
          IMAGE_BASE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          docker manifest create ${IMAGE_BASE}:latest \
            --amend ${IMAGE_BASE}:latest-amd64 \
            --amend ${IMAGE_BASE}:latest-arm64
          docker manifest push ${IMAGE_BASE}:latest

      - name: Create and push manifest (sha)
        run: |
          set -euo pipefail
          IMAGE_BASE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          docker manifest create ${IMAGE_BASE}:sha-${{ github.sha }} \
            --amend ${IMAGE_BASE}:sha-${{ github.sha }}-amd64 \
            --amend ${IMAGE_BASE}:sha-${{ github.sha }}-arm64
          docker manifest push ${IMAGE_BASE}:sha-${{ github.sha }}
